# nginx proxy address - http://172.17.0.1:3003

name: fider
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  fider:
    image: getfider/fider:stable
    pull_policy: always
    container_name: fider-app
    restart: always
    logging: *default-logging
    networks:
      - fider
      - proxy
      - cloudflare
    ports:
      - "172.17.0.1:3003:3000"
    environment:
      TZ: ${TZ:-America/New_York}
      BASE_URL: http://${BASE_HOST_NAME:-localhost}:3003
      DATABASE_URL: postgres://${DB_USER_NAME:-fider}:${DB_USER_PASS:-changeme_db_password}@fider-db:5432/${DB_CREATE_DATABASE_NAME:-fider}?sslmode=disable
      JWT_SECRET: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      EMAIL_NOREPLY: ${APP_ADMIN_EMAIL:-noreply@example.com}
      EMAIL_SMTP_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      EMAIL_SMTP_PORT: ${EMAIL_SERVER_PORT:-587}
      EMAIL_SMTP_USERNAME: ${EMAIL_SERVER_LOGIN_NAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      EMAIL_SMTP_ENABLE_STARTTLS: "true"
      CONTAINER_NAME: fider-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    depends_on:
      - fider-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://fider-app:3000'
      - 'cloudflare.hostname=fider.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.fider-app.entrypoints=http'
      - 'traefik.http.routers.fider-app-secure.tls=true'
      - 'traefik.http.routers.fider-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.fider-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.fider-app.middlewares=fider-app-https-redirect'
      - 'traefik.http.routers.fider-app-secure.entrypoints=https'
      - 'traefik.http.routers.fider-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.fider-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.fider-app-secure.service=fider-app'
      - 'traefik.http.services.fider-app.loadbalancer.server.port=3000'

  fider-db:
    image: postgres:latest
    pull_policy: always
    container_name: fider-db
    restart: always
    logging: *default-logging
    networks:
      - fider
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-fider}
      POSTGRES_USER: ${DB_USER_NAME:-fider}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      CONTAINER_NAME: fider-db
    volumes:
      - ./volumes/data/db/postgres/fider:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  fider:
    name: fider
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
