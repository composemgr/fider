# nginx proxy address - http://172.17.0.1:64169

name: fider
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  fider:
    image: getfider/fider:stable
    container_name: fider-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: fider-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      BASE_URL: http://${BASE_HOST_NAME:-$HOSTNAME}:64169
      DATABASE_URL: postgres://${DB_USER_NAME:-fider}:${DB_USER_PASS:-replace-with-a-random-password}@fider-db:5432/${DB_CREATE_DATABASE_NAME:-fider}?sslmode=disable
      JWT_SECRET: ${APP_SECRET_KEY:-replace-with-a-random-32-character-secret}
      EMAIL_NOREPLY: ${EMAIL_SERVER_MAIL_FROM:-noreply@example.com}
      EMAIL_SMTP_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      EMAIL_SMTP_PORT: ${EMAIL_SERVER_PORT:-587}
      EMAIL_SMTP_USERNAME: ${EMAIL_SERVER_LOGIN_NAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      EMAIL_SMTP_ENABLE_STARTTLS: 'true'
    ports:
      - '172.17.0.1:64169:3000'
    depends_on:
      fider-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fider

  fider-db:
    image: postgres:latest
    container_name: fider-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: fider-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: fider-db
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-fider}
      POSTGRES_USER: ${DB_USER_NAME:-fider}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
    volumes:
      - './volumes/db/postgres/fider:/var/lib/postgresql/data:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fider

networks:
  fider:
    name: fider
    external: false
