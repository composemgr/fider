# nginx proxy address - http://172.17.0.1:3003

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  fider:
    image: fider/fider:latest
    container_name: fider-app
    restart: unless-stopped
    logging: *default-logging
    networks:
      - fider
    ports:
      - "3003:3003"
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./rootfs/data/fider:/data
      - ./rootfs/config/fider:/config
    depends_on:
      - fider-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003"]
      interval: 30s
      timeout: 10s
      retries: 3

  fider-db:
    image: postgres:16-alpine
    container_name: fider-db
    restart: unless-stopped
    logging: *default-logging
    networks:
      - fider
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-fider}
      POSTGRES_USER: ${DB_USER_NAME:-fider}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
    volumes:
      - ./rootfs/db/postgres/fider:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${{POSTGRES_USER}} -d $${{POSTGRES_DB}}"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  fider:
    external: false
